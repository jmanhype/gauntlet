name: CI

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate repository contracts
        run: |
          test -s README.md
          test -s docs/BUSINESS.md
          test -s docs/DESIGN.md
          test -s docs/ARCHITECTURE.md
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run test suite
        if: hashFiles('pyproject.toml') != ''
        run: uv run --frozen --group dev pytest -q
